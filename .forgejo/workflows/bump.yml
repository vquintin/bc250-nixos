# On each push: bump the `bc250` input of nixos-config to this commit. That push
# runs nixos-config's own deploy workflow, which rebuilds the machines.
name: bump nixos-config

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  bump:
    runs-on: native
    # The CI deploy key (machines/ci/deploy_ed25519.pub in nixos-config),
    # allowed to push to nixos-config. Only ever loaded by .forgejo/with-key.
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Retried: a push to nixos-config in between makes ours non-fast-forward.
      - name: Bump nixos-config
        run: |
          .forgejo/with-key git clone --depth 1 ssh://forgejo@forgejo.quintin.home.arpa/virgile/nixos-config.git cfg
          cd cfg
          for attempt in 1 2 3; do
            ../.forgejo/with-key nix flake update bc250
            git diff --quiet && exit 0
            git -c user.name="Forgejo Actions" -c user.email=ci@quintin.home.arpa \
              commit -qam "flake.lock: bc250 → ${GITHUB_SHA::7}"
            ../.forgejo/with-key git push origin HEAD:main && exit 0
            ../.forgejo/with-key git fetch --depth 1 origin main && git reset -q --hard origin/main
          done
          exit 1
